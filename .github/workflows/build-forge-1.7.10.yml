name: Build Forge 1.7.10 universal jar

on:
  workflow_dispatch:
  push:
    branches:
      - forge-1.7.10
  pull_request:
    branches:
      - forge-1.7.10

permissions:
  contents: read

jobs:
  build:
    name: Build universal client/server jar
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Build and test
        run: ./gradlew clean build --no-daemon

      - name: Select universal release jar
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-dev.jar' ! -name '*-sources.jar' ! -name '*-api.jar' | sort)
          if [[ ${#jars[@]} -ne 1 ]]; then
            printf 'Expected exactly one universal release jar, found %s:\n' "${#jars[@]}" >&2
            printf '  %s\n' "${jars[@]:-<none>}" >&2
            exit 1
          fi
          cp "${jars[0]}" locatorborder-forge-1.7.10-universal.jar
          sha256sum locatorborder-forge-1.7.10-universal.jar > locatorborder-forge-1.7.10-universal.jar.sha256
          echo "jar=locatorborder-forge-1.7.10-universal.jar" >> "$GITHUB_OUTPUT"

      - name: Upload universal jar
        uses: actions/upload-artifact@v7
        with:
          name: locatorborder-forge-1.7.10-universal-${{ github.sha }}
          path: |
            ${{ steps.artifact.outputs.jar }}
            ${{ steps.artifact.outputs.jar }}.sha256
          if-no-files-found: error
          retention-days: 30
